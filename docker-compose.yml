services:
  resume-bot:
    build: ./backend
    container_name: cv-bot
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:18002:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/static:/app/static
      - ./backend/facts:/app/facts
    mem_limit: 350m
    memswap_limit: 500m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"